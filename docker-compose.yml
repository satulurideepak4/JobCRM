version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: jobcrm_postgres
    environment:
      POSTGRES_DB: jobcrm
      POSTGRES_USER: jobcrm
      POSTGRES_PASSWORD: jobcrm
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobcrm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
